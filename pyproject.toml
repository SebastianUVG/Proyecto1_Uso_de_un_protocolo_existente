[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-assistant"
version = "0.1.0"
description = "Inventory domain and reproducible SQLite database for a university networking project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "openai>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
external-mcp = ["mcp-server-git>=2026.8.18,<2027"]
test = ["httpx>=0.27.0,<1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inventory_assistant.inventory.sqlite" = ["schema.sql"]
"inventory_assistant.web" = ["static/*.html", "static/*.css", "static/*.js"]
