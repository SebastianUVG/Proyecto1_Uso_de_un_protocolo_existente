[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-assistant"
version = "0.1.0"
description = "Inventory domain and reproducible SQLite database for a university networking project"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inventory_assistant.inventory.sqlite" = ["schema.sql"]

